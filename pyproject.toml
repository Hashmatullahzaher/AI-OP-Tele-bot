[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-ai-core"
version = "0.1.0"
description = "Reusable typed AI operating layer for authorized company data sources"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bot = ["google-auth>=2.30,<3", "requests>=2.31,<3"]
anthropic = ["anthropic>=1,<2"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["osai"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["google.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true


[tool.setuptools.packages.find]
include = ["osai*"]
exclude = ["app*", "web*", "data*", "deploy*", "prompts*", "tests*"]
