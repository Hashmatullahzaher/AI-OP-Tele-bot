name: Windows Installer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt pyinstaller
      - name: Run packaging and setup contract tests
        run: python -m unittest tests.test_windows_packaging tests.test_setup_config tests.test_setup_wizard -v
      - name: Build standalone service executable
        run: pyinstaller --noconfirm --clean packaging/windows/osai-core-service.spec
      - name: Check bundled runtime before installation
        shell: pwsh
        run: |
          $env:PROGRAMDATA = "$env:RUNNER_TEMP\preinstall-programdata"
          & ".\dist\OS-AI-Core-Service.exe" check
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime check failed." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($null -eq $command) { throw "ISCC.exe was not found." }
            $iscc = $command.Source
          }
          & $iscc "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
      - name: Install, verify service/dashboard, and uninstall
        shell: pwsh
        run: |
          .\scripts\windows\installer-smoke.ps1 `
            -InstallerPath ".\installer-dist\OS-AI-Core-Setup.exe"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: os-ai-core-windows-installer-uat
          path: installer-dist/OS-AI-Core-Setup.exe
          if-no-files-found: error
          retention-days: 7
