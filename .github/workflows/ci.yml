name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check osai tests/test_foundation.py tests/test_tenant_security.py tests/test_drive_connector.py tests/test_rest_api_connector.py tests/test_agent.py
      - run: mypy osai
      - run: python -m compileall -q app osai
      - run: python -m unittest discover -s tests -v
