# Run from the repository root on the server:
#   docker compose -f deploy/bot/compose.yml up -d --build
# Secrets live in /etc/osai on the server, never in Git.
services:
  bot:
    build:
      context: ../..
      dockerfile: deploy/bot/Dockerfile
    restart: unless-stopped
    env_file: /etc/osai/bot.env
    volumes:
      - /etc/osai/catalog.json:/etc/osai/catalog.json:ro
      - /etc/osai/google-service-account.json:/etc/osai/google-service-account.json:ro
      - osai-data:/var/lib/osai
volumes:
  osai-data:
